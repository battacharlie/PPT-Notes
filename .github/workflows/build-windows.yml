name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install -r windows/requirements.txt

      - name: Crea PPTNotes.exe
        run: >
          python -m PyInstaller --onefile --console --noconfirm --clean
          --name PPTNotes
          --hidden-import win32com.client --hidden-import pythoncom
          windows/ppt_notes.py

      - name: Collaudo exe (modalità demo, senza PowerPoint)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PPTNotes.exe -ArgumentList "--demo","--no-browser","--port","8099" -PassThru
          Start-Sleep -Seconds 10
          $s = Invoke-WebRequest http://localhost:8099/state -UseBasicParsing
          if ($s.Content -notmatch "demo_apertura") { throw "stato non valido: $($s.Content)" }
          $q = Invoke-WebRequest http://localhost:8099/qr.svg -UseBasicParsing
          if ($q.Content -notmatch "<svg") { throw "QR non valido" }
          $c = Invoke-WebRequest -Method Post -Uri http://localhost:8099/cmd -Body '{"id":"d1","action":"next"}' -UseBasicParsing
          if ($c.Content -notmatch '"ok": true') { throw "comando non valido: $($c.Content)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Collaudo OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PPTNotes-windows
          path: dist/PPTNotes.exe

      - name: Pubblica release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PPTNotes.exe
