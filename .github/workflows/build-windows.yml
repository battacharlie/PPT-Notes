name: Compila

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Versione: dal tag vX.Y, oppure su main dal file VERSION. Su main, se la
      # versione non è ancora pubblicata, la release viene creata in automatico.
      - name: Versione
        id: ver
        shell: bash
        run: |
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"; RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="v$(tr -d ' \r\n' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              VERSION="$VERSION-main-${GITHUB_SHA::7}"   # già pubblicata: compilazione di prova
            else
              RELEASE=true
            fi
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          if [ "$RELEASE" = true ]; then NUM="${VERSION#v}"; else NUM="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "shown=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Versione $VERSION (numero $NUM), release: $RELEASE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install -r windows/requirements.txt

      - name: Test (anteprime slide e pagina)
        run: python tools/test_deckwhisperer.py

      - name: Informazioni di versione
        run: python tools/buildinfo.py "${{ steps.ver.outputs.shown }}" "${{ steps.ver.outputs.num }}"

      - name: Crea mefistofele.exe
        run: >
          python -m PyInstaller --onefile --console --noconfirm --clean
          --name mefistofele
          --icon windows/assets/deckwhisperer.ico
          --add-data "windows/assets;assets"
          --add-data "docs;docs"
          --version-file windows/version_info.txt
          --hidden-import win32com.client --hidden-import pythoncom
          windows/deckwhisperer.py

      - name: Collaudo exe (modalità demo, senza PowerPoint)
        shell: pwsh
        run: |
          $vi = (Get-Item dist\mefistofele.exe).VersionInfo
          if ($vi.ProductName -ne "MEFISTOFELE DeckWhisperer") { throw "Info versione exe errate: $($vi.ProductName)" }
          $p = Start-Process -FilePath dist\mefistofele.exe -ArgumentList "--demo","--no-browser","--port","8099" -PassThru
          Start-Sleep -Seconds 10
          $h = Invoke-WebRequest http://localhost:8099/ -UseBasicParsing
          if ($h.Content -notmatch "DeckWhisperer" -or $h.Content -notmatch "mywebtvlive.com") { throw "pagina senza nome/crediti" }
          if ($h.Content -notmatch "Versione ${{ steps.ver.outputs.shown }}") { throw "versione non mostrata nella pagina" }
          $s = Invoke-WebRequest http://localhost:8099/state -UseBasicParsing
          if ($s.Content -notmatch "demo_apertura") { throw "stato non valido: $($s.Content)" }
          $q = Invoke-WebRequest http://localhost:8099/qr.svg -UseBasicParsing
          if ($q.Content -notmatch "<svg") { throw "QR non valido" }
          $d = Invoke-WebRequest http://localhost:8099/diagnostica -UseBasicParsing
          if ($d.Content -notmatch "Registro previsto" -or $d.Content -notmatch "Avvio MEFISTOFELE DeckWhisperer") { throw "pagina diagnostica non valida" }
          if (-not (Test-Path dist\mefistofele.log)) { throw "mefistofele.log non creato accanto all'exe" }
          $g = Invoke-WebRequest http://localhost:8099/start -UseBasicParsing
          if ($g.Content -notmatch "Cosa vuoi far vedere" -or $g.Content -notmatch "/qr.svg" -or $g.Content -notmatch "u_goto" -or $g.Content -notmatch "Remote notes") { throw "pagina di gestione non valida" }
          $j = Invoke-WebRequest http://localhost:8099/settings.json -UseBasicParsing
          if ($j.Content -notmatch '"ui"') { throw "impostazioni non valide: $($j.Content)" }
          if ($s.Content -notmatch '"ui"') { throw "stato senza scelte per i telefoni" }
          $gu = Invoke-WebRequest http://localhost:8099/guida -UseBasicParsing
          if ($gu.Content -notmatch "Avvio in 4 passi") { throw "guida non inclusa nell'exe" }
          $ge = Invoke-WebRequest "http://localhost:8099/guida?lang=en" -UseBasicParsing
          if ($ge.Content -notmatch "Quick start") { throw "guida inglese non inclusa nell'exe" }
          $sl = Invoke-WebRequest http://localhost:8099/slide/d1/1.png -UseBasicParsing
          if ($sl.StatusCode -ne 200 -or $sl.Content -notmatch "demo_apertura") { throw "anteprima slide non valida" }
          if ($h.Content -notmatch "Slide successiva") { throw "pulsante Slide successiva mancante" }
          foreach ($f in "static/mwtl-logo.png","static/deckwhisperer-192.png","favicon.ico") {
            $r = Invoke-WebRequest "http://localhost:8099/$f" -UseBasicParsing
            if ($r.StatusCode -ne 200 -or $r.RawContentLength -lt 500) { throw "asset mancante: $f" }
          }
          $c = Invoke-WebRequest -Method Post -Uri http://localhost:8099/cmd -Body '{"id":"d1","action":"next"}' -UseBasicParsing
          if ($c.Content -notmatch '"ok": true') { throw "comando non valido: $($c.Content)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Collaudo OK"

      - name: Impronte SHA256
        shell: bash
        run: cd dist && sha256sum mefistofele.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mefistofele-windows
          path: |
            dist/mefistofele.exe
            dist/SHA256SUMS.txt

      - name: Pubblica release
        if: steps.ver.outputs.release == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MEFISTOFELE DeckWhisperer ${{ steps.ver.outputs.num }}
          files: |
            dist/mefistofele.exe
            dist/SHA256SUMS.txt
            docs/INSTRUCTIONS.md
            docs/ISTRUZIONI.md
          body: |
            ## MEFISTOFELE DeckWhisperer – Remote notes & control for PowerPoint

            ### Download
            | File | For / Per |
            |---|---|
            | `mefistofele.exe` | Windows 10/11 + PowerPoint |
            | `INSTRUCTIONS.md` | Instructions in English |
            | `ISTRUZIONI.md` | Istruzioni in italiano |

            ### 🇬🇧 English
            **How to use**: double-click `mefistofele.exe`; the management page opens in your browser with a QR code. Scan it with your phone (same Wi-Fi), pick the network adapter for the QR and what the phone should show (toolbar, text style, current/next slide, go to slide, navigation, lock remote screen) and start your slide show in PowerPoint. If Windows says "Windows protected your PC": *More info → Run anyway*. On first start allow **Private networks**.
            Full instructions: [INSTRUCTIONS.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTRUCTIONS.md).

            ### 🇮🇹 Italiano
            **Come si usa**: doppio clic su `mefistofele.exe`; nel browser si apre la pagina di gestione con il QR code. Inquadralo con lo smartphone (stessa rete Wi-Fi), scegli la scheda di rete del QR e cosa deve mostrare il telefono (barra degli strumenti, stile testo, slide in onda/successiva, vai alla slide, navigazione, blocca schermo remoto) e avvia la presentazione in PowerPoint. Se compare "Windows ha protetto il PC": *Ulteriori informazioni → Esegui comunque*. Al primo avvio consenti le **Reti private**.
            Istruzioni complete: [ISTRUZIONI.md](https://github.com/${{ github.repository }}/blob/main/docs/ISTRUZIONI.md).

            ---
            Ideato e sviluppato da [www.andreabattaglioli.it](https://www.andreabattaglioli.it) · [MyWebTvLive.com](https://www.mywebtvlive.com) · Made in Bolognina
