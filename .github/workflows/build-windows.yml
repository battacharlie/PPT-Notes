name: Compila

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      shown: ${{ steps.ver.outputs.shown }}
      num: ${{ steps.ver.outputs.num }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # Versione: dal tag vX.Y, oppure su main dal file VERSION. Su main, se la
      # versione non è ancora pubblicata, la release viene creata in automatico.
      - name: Versione
        id: ver
        shell: bash
        run: |
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"; RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="v$(tr -d ' \r\n' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              VERSION="$VERSION-main-${GITHUB_SHA::7}"   # già pubblicata: compilazione di prova
            else
              RELEASE=true
            fi
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          if [ "$RELEASE" = true ]; then NUM="${VERSION#v}"; else NUM="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "shown=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Versione $VERSION (numero $NUM), release: $RELEASE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install -r windows/requirements.txt

      - name: Test (anteprime slide e pagina)
        run: python tools/test_deckwhisperer.py

      - name: Test accesso remoto (relay + programma)
        run: python tools/test_remote.py

      - name: Informazioni di versione
        run: python tools/buildinfo.py "${{ steps.ver.outputs.shown }}" "${{ steps.ver.outputs.num }}"

      - name: Crea mefistofele.exe
        run: >
          python -m PyInstaller --onefile --console --noconfirm --clean
          --name mefistofele
          --icon windows/assets/deckwhisperer.ico
          --add-data "windows/assets;assets"
          --add-data "docs;docs"
          --version-file windows/version_info.txt
          --hidden-import win32com.client --hidden-import pythoncom
          windows/deckwhisperer.py

      - name: Collaudo exe (modalità demo, senza PowerPoint)
        shell: pwsh
        run: |
          $vi = (Get-Item dist\mefistofele.exe).VersionInfo
          if ($vi.ProductName -ne "MEFISTOFELE DeckWhisperer") { throw "Info versione exe errate: $($vi.ProductName)" }
          $p = Start-Process -FilePath dist\mefistofele.exe -ArgumentList "--demo","--no-browser","--port","8099" -PassThru
          Start-Sleep -Seconds 10
          $h = Invoke-WebRequest http://localhost:8099/ -UseBasicParsing
          if ($h.Content -notmatch "DeckWhisperer" -or $h.Content -notmatch "mywebtvlive.com") { throw "pagina senza nome/crediti" }
          if ($h.Content -notmatch [regex]::Escape("</span> ${{ steps.ver.outputs.shown }}")) { throw "versione non mostrata nella pagina" }
          $s = Invoke-WebRequest http://localhost:8099/state -UseBasicParsing
          if ($s.Content -notmatch "demo_apertura") { throw "stato non valido: $($s.Content)" }
          $q = Invoke-WebRequest http://localhost:8099/qr.svg -UseBasicParsing
          if ($q.Content -notmatch "<svg") { throw "QR non valido" }
          $d = Invoke-WebRequest http://localhost:8099/diagnostica -UseBasicParsing
          if ($d.Content -notmatch "Registro previsto" -or $d.Content -notmatch "Avvio MEFISTOFELE DeckWhisperer") { throw "pagina diagnostica non valida" }
          if (-not (Test-Path dist\mefistofele.log)) { throw "mefistofele.log non creato accanto all'exe" }
          $g = Invoke-WebRequest http://localhost:8099/start -UseBasicParsing
          if ($g.Content -notmatch "What the phones will show" -or $g.Content -notmatch "/qr.svg" -or $g.Content -notmatch "u_goto" -or $g.Content -notmatch "Remote notes") { throw "pagina di gestione non valida" }
          $j = Invoke-WebRequest http://localhost:8099/settings.json -UseBasicParsing
          if ($j.Content -notmatch '"ui"') { throw "impostazioni non valide: $($j.Content)" }
          if ($s.Content -notmatch '"ui"') { throw "stato senza scelte per i telefoni" }
          $gu = Invoke-WebRequest http://localhost:8099/guida -UseBasicParsing
          if ($gu.Content -notmatch "Quick start") { throw "guida non inclusa nell'exe" }
          foreach ($l in "it","fr","es","ar","zh") {
            $ge = Invoke-WebRequest "http://localhost:8099/guida?lang=$l" -UseBasicParsing
            if ($ge.Content -notmatch ('lang="' + $l + '"') -or $ge.Content -notmatch "<h2>") { throw "manuale $l non incluso nell'exe" }
          }
          $ge = Invoke-WebRequest "http://localhost:8099/guida?lang=it" -UseBasicParsing
          if ($ge.Content -notmatch "Avvio in 4 passi") { throw "manuale italiano non incluso nell'exe" }
          $sj = Invoke-WebRequest http://localhost:8099/settings.json -UseBasicParsing
          if ($sj.Content -notmatch '"lang": "en"') { throw "lingua predefinita non inglese: $($sj.Content)" }
          $sl = Invoke-WebRequest http://localhost:8099/slide/d1/1.png -UseBasicParsing
          if ($sl.StatusCode -ne 200 -or $sl.Content -notmatch "demo_apertura") { throw "anteprima slide non valida" }
          if ($h.Content -notmatch "Next slide") { throw "pulsante Next slide mancante" }
          foreach ($f in "static/mwtl-logo.png","static/deckwhisperer-192.png","favicon.ico") {
            $r = Invoke-WebRequest "http://localhost:8099/$f" -UseBasicParsing
            if ($r.StatusCode -ne 200 -or $r.RawContentLength -lt 500) { throw "asset mancante: $f" }
          }
          $c = Invoke-WebRequest -Method Post -Uri http://localhost:8099/cmd -Body '{"id":"d1","action":"next"}' -UseBasicParsing
          if ($c.Content -notmatch '"ok": true') { throw "comando non valido: $($c.Content)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Collaudo OK"

      - name: Impronte SHA256
        shell: bash
        run: cd dist && sha256sum mefistofele.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mefistofele-windows
          path: |
            dist/mefistofele.exe
            dist/SHA256SUMS.txt

  mac:
    runs-on: macos-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install -r windows/requirements.txt

      - name: Test (anteprime slide e pagina)
        run: python tools/test_deckwhisperer.py

      - name: Test accesso remoto (relay + programma)
        run: python tools/test_remote.py

      - name: Informazioni di versione
        run: python tools/buildinfo.py "${{ needs.build.outputs.shown }}" "${{ needs.build.outputs.num }}"

      - name: Crea mefistofele (Mac)
        run: >
          python -m PyInstaller --onefile --console --noconfirm --clean
          --name mefistofele
          --add-data "windows/assets:assets"
          --add-data "docs:docs"
          windows/deckwhisperer.py

      - name: Collaudo (modalità demo, senza PowerPoint)
        run: |
          chmod +x dist/mefistofele
          dist/mefistofele --demo --no-browser --port 8099 > mac-smoke.log 2>&1 &
          PID=$!
          sleep 12
          curl -sf http://localhost:8099/ | grep -q "DeckWhisperer"
          curl -sf http://localhost:8099/ | grep -qF "</span> ${{ needs.build.outputs.shown }}"
          curl -sf http://localhost:8099/state | grep -q "demo_apertura"
          curl -sf http://localhost:8099/qr.svg | grep -q "<svg"
          curl -sf http://localhost:8099/start | grep -q "What the phones will show"
          curl -sf http://localhost:8099/guida | grep -q "Quick start"
          for l in it fr es ar zh; do curl -sf "http://localhost:8099/guida?lang=$l" | grep -q 'lang="'$l'"'; done
          curl -sf -X POST -d '{"id":"d1","action":"next"}' http://localhost:8099/cmd | grep -q '"ok": true'
          kill $PID || true
          cat mac-smoke.log
          echo "Collaudo OK"

      - name: Crea mefistofele-mac.zip
        run: |
          cd dist
          ditto -c -k --keepParent mefistofele mefistofele-mac.zip
          shasum -a 256 mefistofele-mac.zip > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mefistofele-mac
          path: |
            dist/mefistofele-mac.zip
            dist/SHA256SUMS-mac.txt

  release:
    if: needs.build.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, mac]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Impronte SHA256 uniche
        run: |
          cat artifacts/mefistofele-windows/SHA256SUMS.txt artifacts/mefistofele-mac/SHA256SUMS-mac.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MEFISTOFELE DeckWhisperer ${{ needs.build.outputs.num }}
          files: |
            artifacts/mefistofele-windows/mefistofele.exe
            artifacts/mefistofele-mac/mefistofele-mac.zip
            SHA256SUMS.txt
            docs/MANUAL-en.md
            docs/MANUAL-it.md
            docs/MANUAL-fr.md
            docs/MANUAL-es.md
            docs/MANUAL-ar.md
            docs/MANUAL-zh.md
          body: |
            ## MEFISTOFELE DeckWhisperer – Remote notes & control for PowerPoint

            ### Download
            | File | For |
            |---|---|
            | `mefistofele.exe` | Windows 10/11 + PowerPoint |
            | `mefistofele-mac.zip` | macOS 12+ + PowerPoint for Mac |
            | `MANUAL-xx.md` | Manual: [English](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL-en.md) · [Italiano](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL-it.md) · [Français](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL-fr.md) · [Español](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL-es.md) · [العربية](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL-ar.md) · [中文](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL-zh.md) |

            ### What's new in 4.1
            - **More reliable fast clicks**: commands from the phone take priority over slide previews, are no longer dropped after 2 seconds, and consecutive next/previous clicks are added up into one step.
            - The log (`mefistofele.log`) now records discarded commands, summaries of fast clicks and slow previews.
            - **Known limitation**: with presentations of more than 10 slides and very fast clicks, playback problems may still occur (late previews or steps not completed). If it happens, switch the previews off (Current slide, Next slide) on the management page.

            ### What's new in 4.0
            - **Remote access** for phones outside your network (mobile data, another Wi-Fi). Off by default; switch it on from the management page. Private link and QR code that change every time, PIN always required for the controls (without a PIN remote phones only read the notes), nothing to open on your router.
            - Notes and previews cross the MEFISTOFELE relay (`remote.mefistofele.com`) encrypted over HTTPS and are not stored.
            - New options `--remote` and `--relay`.

            ### 3.3 or 4.1?
            - **3.3**: phones on the same network only; nothing ever leaves your network. Available in the Releases page.
            - **4.1**: everything in 3.3, plus optional remote access.

            **How to use**: run the program; the management page opens in your browser with a QR code. Scan it with your phone (same Wi-Fi, or use remote access from outside), pick the language, the network adapter and what the phone should show, then start your slide show in PowerPoint.
            Windows: if it says "Windows protected your PC": *More info → Run anyway*; allow **Private networks**.
            Mac: unzip, then follow the Mac steps in the manual (Terminal, `chmod +x`, allow Terminal to control PowerPoint).

